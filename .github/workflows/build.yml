name: Build Dylib for Sideloading

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      THEOS: ${{ runner.temp }}/theos
      THEOS_MAKE_PATH: ${{ runner.temp }}/theos/makefiles

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Theos and dependencies
      run: |
        brew install -q ldid dpkg || true
        git clone --recursive https://github.com/theos/theos.git "$THEOS"

    - name: Build dylib
      run: |
        make clean
        make

    - name: Locate dylib
      id: locate
      run: |
        DYL_PATH=$(find . -name "LiquidGlassIGHook.dylib" -print -quit)
        if [ -z "$DYL_PATH" ]; then
          echo "LiquidGlassIGHook.dylib not found" >&2
          exit 1
        fi
        echo "path=$DYL_PATH" >> "$GITHUB_OUTPUT"

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiquidGlassIGHook-dylib
        path: ${{ steps.locate.outputs.path }}
