name: Build Dylib for Sideloading

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Theos and dependencies
      run: |
        # Install dependencies
        brew install -q ldid dpkg || true
        
        # Clone Theos
        git clone --recursive https://github.com/theos/theos.git "<LaTex>$HOME/theos"
        export THEOS="$</LaTex>HOME/theos"

    - name: Modify Makefile for non-Substrate dylib build
      run: |
        # Cria um novo Makefile com as configurações corretas
        cat > Makefile.new << EOF
# Targets an arm64 iOS dynamic library implementing Instagram LiquidGlass hooks.

ARCHS = arm64
TARGET := iphone:clang:latest:17.0


include \<LaTex>$(THEOS)/makefiles/common.mk

TWEAK_NAME = LiquidGlassIGHook
LiquidGlassIGHook_FILES = src/IGLiquidGlassIGHook.xm
LiquidGlassIGHook_CFLAGS = -fobjc-arc

LiquidGlassIGHook_LIBRARIES =

include \$</LaTex>(THEOS_MAKE_PATH)/dylib.mk

LiquidGlassIGHook_LDFLAGS += -Wl,-install_name,@executable_path/LiquidGlassIGHook.dylib

after-build::
	@echo Signing dylib...
	@ldid -S \<LaTex>$(THEOS_OBJDIR)/LiquidGlassIGHook.dylib
EOF
        # Substitui o Makefile antigo pelo novo
        mv Makefile.new Makefile
        
        cat Makefile

    - name: Build dylib
      run: |
        export THEOS="$</LaTex>HOME/theos"
        export THEOS_MAKE_PATH="<LaTex>$THEOS/makefiles"
        make clean
        make

    - name: Locate dylib
      id: locate
      run: |
        DYL_PATH=$</LaTex>(find . -name "LiquidGlassIGHook.dylib" -print -quit)
        if [ -z "<LaTex>$DYL_PATH" ]; then
          echo "LiquidGlassIGHook.dylib not found" >&2
          exit 1
        fi
        echo "path=$</LaTex>DYL_PATH" >> "<LaTex>$GITHUB_OUTPUT"

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiquidGlassIGHook-dylib
        path: $</LaTex>{{ steps.locate.outputs.path }}
