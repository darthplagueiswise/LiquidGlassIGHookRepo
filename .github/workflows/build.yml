name: Build Dylib for Sideloading

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Theos and dependencies
      run: |
        # Install dependencies
        brew install -q ldid dpkg || true
        
        # Clone Theos
        git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
        export THEOS="<LaTex>$HOME/theos"

    - name: Modify Makefile for non-Substrate dylib build
      run: |
        export THEOS="$</LaTex>HOME/theos"
        
        # 1. Replace 'tweak.mk' with 'dylib.mk' to build a standard dylib
        sed -i '' 's/include <LaTex>$(THEOS_MAKE_PATH)\/tweak.mk/include $</LaTex>(THEOS_MAKE_PATH)\/dylib.mk/' Makefile
        
        # 2. Remove INSTALL_TARGET_PROCESSES (only for Substrate)
        sed -i '' '/INSTALL_TARGET_PROCESSES/d' Makefile
        
        # 3. Exclui a dependência padrão do Substrate
        echo "LiquidGlassIGHook_LIBRARIES =" >> Makefile
        
        # 4. Add custom linker flag for install_name (crucial for sideloading)
        echo "LiquidGlassIGHook_LDFLAGS += -Wl,-install_name,@executable_path/LiquidGlassIGHook.dylib" >> Makefile
        
        # 5. Add a post-build step to sign the dylib with ldid (required for sideloading)
        echo "after-build::" >> Makefile
        echo "\t@echo Signing dylib..." >> Makefile
        echo "\t@ldid -S \<LaTex>$(THEOS_OBJDIR)/LiquidGlassIGHook.dylib" >> Makefile
        
        cat Makefile

    - name: Build dylib
      run: |
        export THEOS="$</LaTex>HOME/theos"
        export THEOS_MAKE_PATH="<LaTex>$THEOS/makefiles"
        make clean
        make

    - name: Locate dylib
      id: locate
      run: |
        DYL_PATH=$</LaTex>(find . -name "LiquidGlassIGHook.dylib" -print -quit)
        if [ -z "<LaTex>$DYL_PATH" ]; then
          echo "LiquidGlassIGHook.dylib not found" >&2
          exit 1
        fi
        echo "path=$</LaTex>DYL_PATH" >> "<LaTex>$GITHUB_OUTPUT"

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiquidGlassIGHook-dylib
        path: $</LaTex>{{ steps.locate.outputs.path }}
